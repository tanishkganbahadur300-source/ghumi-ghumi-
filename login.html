<!DOCTYPE html>
<html lang="en" data-public>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · GHUMI GHUMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GHUMI GHUMI">
  <script src="auth.js"></script>
</head>
<body class="login-page">
  <div id="background" class="page-bg" aria-hidden="true"></div>

  <main class="login-main">
    <form id="login-form" class="login-card" autocomplete="on">
      <h1 class="login-title">GHUMI GHUMI</h1>
      <p class="login-text">Log in with your name and the group password.</p>

      <label class="login-label" for="login-name">Name</label>
      <input id="login-name" class="add-input login-input" type="text" name="username" autocomplete="username" maxlength="30" required>

      <label class="login-label" for="login-password">Password</label>
      <div class="login-password">
        <input id="login-password" class="add-input login-input" type="password" name="password" autocomplete="current-password" required>
        <button id="login-show" class="login-show" type="button" aria-pressed="false" aria-label="Show password">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.600 5.200A10.500 10.500 0 0 1 12 5c6.400 0 10 7 10 7a17 17 0 0 1-3.300 4.200M6.200 6.300A17 17 0 0 0 2 12s3.600 7 10 7a10 10 0 0 0 4.200-.900"/><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>
        </button>
      </div>

      <p id="login-error" class="passcode-error" role="alert"></p>
      <button id="login-submit" class="cam-btn cam-post login-submit" type="submit">Continue</button>
      <a class="login-back" href="index.html">Back</a>
    </form>
  </main>

  <script src="backgrounds.js"></script>
  <script src="media-paths.js"></script>
  <script src="slideshow.js"></script>
  <script>
    // already logged in on this device: go straight in
    if (Auth.token()) Auth.goNext();

    createBackgroundSlideshow(document.getElementById("background"), {
      images: BACKGROUND_IMAGES,
      interval: 6000
    });

    // the eye button shows or hides what was typed in the password box
    const passwordBox = document.getElementById("login-password");
    const showBtn = document.getElementById("login-show");
    showBtn.addEventListener("click", () => {
      const show = passwordBox.type === "password";
      passwordBox.type = show ? "text" : "password";
      showBtn.setAttribute("aria-pressed", show ? "true" : "false");
      showBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      passwordBox.focus();
    });

    const form = document.getElementById("login-form");
    const error = document.getElementById("login-error");
    const submit = document.getElementById("login-submit");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      submit.disabled = true;
      submit.textContent = "Checking…";
      try {
        await Auth.login(document.getElementById("login-name").value, document.getElementById("login-password").value);
        Auth.goNext();
      } catch (err) {
        error.textContent = err instanceof TypeError ? "No connection. Check the internet and try again." : err.message;
        submit.disabled = false;
        submit.textContent = "Continue";
      }
    });
  </script>
  <script>
    // lets phones and computers install the site as an app (only on a real web address)
    if ("serviceWorker" in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
