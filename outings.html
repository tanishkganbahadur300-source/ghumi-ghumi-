<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outings · GHUMI GHUMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GHUMI GHUMI">
  <script src="auth.js"></script>
</head>
<body class="list-page">
  <div id="background" class="page-bg" aria-hidden="true"></div>

  <header class="wall-header list-header">
    <a class="wall-back" href="home.html" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 class="wall-title">Outings</h1>
  </header>

  <main class="list-main">
    <ul id="members" class="member-grid"></ul>
    <p id="list-empty" class="list-empty" hidden>No outings yet. Add the first one below.</p>

    <form id="add-form" class="add-member" autocomplete="off">
      <label class="add-label" for="member-name">Add outing</label>
      <div class="add-row">
        <input id="member-name" class="add-input" type="text" maxlength="30" placeholder="Outing name" required>
        <button class="block-btn add-btn" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add
        </button>
      </div>
      <p id="add-note" class="add-note" role="status"></p>
    </form>
  </main>

  <script src="backgrounds.js"></script>
  <script src="media-paths.js"></script>
  <script src="slideshow.js"></script>
  <script src="folders.js"></script>
  <script>
    createBackgroundSlideshow(document.getElementById("background"), {
      images: BACKGROUND_IMAGES,
      interval: 6000
    });

    // the outings; ones added on this page are kept online, so everyone sees them
    createFolderList({
      kind: "outing",
      fixed: [],
      link: "person.html#outing:",
      oldKey: "ghumi-outings"
    });
  </script>
  <script>
    // lets phones and computers install the site as an app (only on a real web address)
    if ("serviceWorker" in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
