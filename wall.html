<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Wall · GHUMI GHUMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GHUMI GHUMI">
  <script src="auth.js"></script>
</head>
<body class="wall-page">
  <div id="dome" class="dome"></div>

  <header class="wall-header">
    <a class="wall-back" href="home.html" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 class="wall-title">Photo Wall</h1>
    <div id="filters" class="wall-filters"></div>
  </header>

  <button id="add-photos" class="chip chip-add chip-corner" type="button">+ Add photos</button>

  <p class="wall-hint">Drag to look around · click a photo to open it</p>

  <div id="lightbox" class="lightbox" data-no-delete hidden>
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="lightbox-media"></div>
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <p class="lightbox-caption"></p>
  </div>

  <script src="wall.js"></script>
  <script src="media-paths.js"></script>
  <script src="media-store.js"></script>
  <script src="uploader.js"></script>
  <script src="dome.js"></script>
  <script>
    const albumName = Object.fromEntries(WALL_ALBUMS.map((a) => [a.key, a.name]));
    let current = WALL_ITEMS; // the items the dome is showing right now
    let openIndex = -1;
    let openedAt = 0;

    // ---------- lightbox ----------
    const lightbox = document.getElementById("lightbox");
    const media = lightbox.querySelector(".lightbox-media");
    const caption = lightbox.querySelector(".lightbox-caption");

    function show(index) {
      openIndex = (index + current.length) % current.length;
      const item = current[openIndex];
      media.textContent = "";
      let el;
      if (item.t === "v") {
        el = document.createElement("video");
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
        el.poster = item.thumb;
      } else {
        el = document.createElement("img");
        el.alt = albumName[item.a] + " photo";
      }
      el.src = item.src;
      media.appendChild(el);
      caption.textContent = albumName[item.a] + " · " + (openIndex + 1) + " of " + current.length;
      if (lightbox.hidden) openedAt = performance.now();
      lightbox.hidden = false;
    }

    function hide() {
      media.textContent = ""; // also stops a playing video
      lightbox.hidden = true;
      openIndex = -1;
    }

    lightbox.querySelector(".lightbox-close").addEventListener("click", hide);
    lightbox.querySelector(".lightbox-prev").addEventListener("click", () => show(openIndex - 1));
    lightbox.querySelector(".lightbox-next").addEventListener("click", () => show(openIndex + 1));
    lightbox.addEventListener("click", (e) => {
      // the click that opened the photo also lands here, so ignore clicks right after opening
      if (performance.now() - openedAt < 400) return;
      if (e.target === lightbox || e.target === media) hide();
    });
    window.addEventListener("keydown", (e) => {
      if (lightbox.hidden) return;
      if (e.key === "Escape") hide();
      if (e.key === "ArrowLeft") show(openIndex - 1);
      if (e.key === "ArrowRight") show(openIndex + 1);
    });

    // ---------- dome ----------
    const dome = createDomeGallery(document.getElementById("dome"), {
      items: current,
      fit: 1,
      maxVerticalRotationDeg: 20,
      dragDampening: 5,
      grayscale: false,
      onOpen: show
    });

    // ---------- filters ----------
    // albums without a tab of their own; their photos still show under "All"
    const HIDDEN_TABS = ["shreya", "gauri"];
    let allItems = WALL_ITEMS; // everything on the wall, including camera posts once loaded
    const bar = document.getElementById("filters");
    function buildFilters() {
    const filters = [
      { label: "All", test: () => true },
      { label: MediaStore.ALBUM.name, test: (i) => i.a === MediaStore.ALBUM.key },
      { label: MediaStore.UPLOADS.name, test: (i) => i.a === MediaStore.UPLOADS.key },
      ...WALL_ALBUMS.filter((a) => !HIDDEN_TABS.includes(a.key))
        .map((a) => ({ label: a.name, test: (i) => i.a === a.key })),
      { label: "Videos", test: (i) => i.t === "v" }
    ];
    bar.textContent = "";
    filters.forEach((f, n) => {
      const count = allItems.filter(f.test).length;
      if (!count) return;
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (n === 0 ? " is-active" : "");
      chip.textContent = f.label + " ";
      const small = document.createElement("span");
      small.textContent = count;
      chip.appendChild(small);
      chip.addEventListener("click", () => {
        bar.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-active"));
        chip.classList.add("is-active");
        current = allItems.filter(f.test);
        dome.setItems(current);
      });
      bar.appendChild(chip);
    });
    }
    buildFilters();

    // photos and videos posted from the camera page come first on the wall
    albumName[MediaStore.ALBUM.key] = MediaStore.ALBUM.name;
    albumName[MediaStore.UPLOADS.key] = MediaStore.UPLOADS.name;
    Uploader.attach(document.getElementById("add-photos"), "wall", () => location.reload());
    MediaStore.state().then(({ posts, hidden }) => {
      if (!posts.length && !hidden.size) return;
      // uploads come first; anything deleted from a page is left out
      allItems = posts.concat(WALL_ITEMS.filter((i) => !hidden.has(i.path)));
      current = allItems;
      buildFilters();
      dome.setItems(current);
    }).catch(() => { /* cannot reach the online list: the wall shows everything it has */ });
  </script>
  <script src="lightbox-tools.js"></script>
  <script>
    // lets phones and computers install the site as an app (only on a real web address)
    if ("serviceWorker" in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
